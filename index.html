<!doctype html>
<html lang="fa" dir="rtl" data-theme="neon">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b18"><meta name="description" content="CHERA — پخش‌کننده موسیقی با اکولایزر و نمایشگر زنده">
<link rel="manifest" href="./manifest.webmanifest">
<title>CHERA | پخش‌کننده موسیقی</title>
<style>
:root{color-scheme:dark;--bg:#080b18;--panel:rgba(19,25,48,.78);--line:rgba(145,164,255,.2);--text:#f4f6ff;--muted:#9ca8c8;--a:#7c5cff;--b:#00e5ff;--glow:rgba(0,229,255,.22)}
[data-theme=cyberpunk]{--a:#ff2e93;--b:#faff00;--glow:rgba(255,46,147,.22)}
[data-theme=galaxy]{--a:#a855f7;--b:#60a5fa;--glow:rgba(168,85,247,.25)}
[data-theme=matrix]{--a:#00d26a;--b:#b6ff00;--glow:rgba(0,210,106,.2)}
[data-theme=gold]{--a:#d6a84b;--b:#fff0a8;--glow:rgba(214,168,75,.2)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--a) 22%,transparent),transparent 48%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px 14px 40px}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:14px;padding:10px 13px}button:active{transform:scale(.97)}button.active{border-color:var(--b);box-shadow:0 0 18px var(--glow);color:var(--b)}
.app{max-width:920px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:28px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,var(--b),var(--a));background-clip:text;color:transparent}.sub{font-size:12px;color:var(--muted);letter-spacing:1px}.glass{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(18px);box-shadow:0 15px 50px #0005;margin-bottom:14px}
.visual{position:relative;display:grid;place-items:center;min-height:220px;overflow:hidden}.visual canvas{position:absolute;inset:0;width:100%;height:100%}.disc{width:146px;height:146px;border-radius:50%;z-index:1;display:grid;place-items:center;background:radial-gradient(circle,#11182b 0 24%,#050711 25% 37%,var(--a) 38% 40%,#10162b 41% 60%,var(--b) 61% 63%,#080b18 64%);box-shadow:0 0 35px var(--glow);animation:spin 8s linear infinite;animation-play-state:paused}.playing .disc{animation-play-state:running}@keyframes spin{to{transform:rotate(360deg)}}.disc span{font-size:30px;color:var(--b);text-shadow:0 0 15px var(--b)}
.track{text-align:center}.track h2{font-size:19px;margin:4px 0}.muted{color:var(--muted);font-size:13px}.progress{display:flex;align-items:center;gap:10px;margin:14px 0}.progress input{flex:1;accent-color:var(--b)}input[type=range]{accent-color:var(--b)}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.mainplay{width:58px;height:58px;border-radius:50%;font-size:22px;background:linear-gradient(135deg,var(--a),var(--b));color:#07101b;border:0;font-weight:900}.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:10px 0}.field input{width:55%;max-width:220px}.eq{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.band{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.band input{height:90px;width:24px;writing-mode:vertical-lr;direction:rtl}.playlist{max-height:300px;overflow:auto}.song{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.song:last-child{border:0}.song .name{flex:1;min-width:0}.song strong,.song small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song small{color:var(--muted);font-size:11px}.song button{padding:7px 10px}.heart{color:#ff6b9b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.hidden{display:none!important}select{background:#151b32;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px}.notice{font-size:12px;color:var(--muted);line-height:1.8}.drive{display:none;text-align:center;padding:26px}.drive.on{display:block}.drive .big{font-size:28px;margin:18px}.drive button{font-size:20px;padding:16px 22px;margin:5px}.video{width:100%;max-height:220px;border-radius:14px;background:#000}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.eq{grid-template-columns:repeat(10,1fr)}.visual{min-height:270px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div><div class="brand">CHERA</div><div class="sub">IMMERSIVE MUSIC PLAYER</div></div><select id="theme" aria-label="پوسته"><option value="neon">نئون</option><option value="cyberpunk">سایبرپانک</option><option value="galaxy">کهکشانی</option><option value="matrix">ماتریکس</option><option value="gold">طلایی</option></select></header>
<section class="glass visual" id="visual"><canvas id="viz"></canvas><div class="disc"><span>♫</span></div></section>
<section class="glass">
<div class="track"><h2 id="title">هنوز آهنگی انتخاب نشده</h2><div class="muted" id="artist">برای شروع، فایل موسیقی را اضافه کنید</div></div>
<div class="progress"><small id="current">0:00</small><input id="seek" type="range" min="0" max="1000" value="0"><small id="duration">0:00</small></div>
<div class="controls"><button id="shuffle" title="پخش تصادفی">🔀</button><button id="prev" title="قبلی">⏮</button><button class="mainplay" id="play" title="پخش">▶</button><button id="next" title="بعدی">⏭</button><button id="repeat" title="تکرار">🔁</button></div>
<div class="tools" style="margin-top:14px"><button id="pick">＋ افزودن فایل</button><button id="folder">▤ انتخاب پوشه</button><button id="favView">♥ علاقه‌مندی‌ها</button><button id="driveBtn">🚗 حالت رانندگی</button></div>
<input id="files" class="hidden" type="file" accept="audio/*,video/*" multiple>
<input id="folders" class="hidden" type="file" accept="audio/*,video/*" webkitdirectory multiple>
<video id="media" class="video hidden" playsinline></video>
</section>
<section class="glass">
<div class="tabs"><button class="active" data-tab="queue">فهرست پخش</button><button data-tab="equalizer">اکولایزر</button><button data-tab="sound">تنظیمات صدا</button></div>
<div id="queue"><div class="playlist" id="list"><p class="notice">فهرست خالی است. فایل‌ها را انتخاب کنید.</p></div></div>
<div id="equalizer" class="hidden"><div class="tools"><button id="eqToggle" class="active">اکولایزر روشن</button><button id="eqReset">بازنشانی اکولایزر</button></div><div class="eq" id="bands"></div></div>
<div id="sound" class="hidden"><label class="field">مستوى الصوت <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></label><label class="field">تقویت بیس نرم <input id="bass" type="range" min="0" max="12" value="0"></label><label class="field">تقویت صدای زیر <input id="treble" type="range" min="0" max="12" value="0"></label><label class="field">آمپلی‌فایر <input id="amp" type="range" min="1" max="2" step=".01" value="1"></label><p class="notice">افزایش بیش از حد صدا ممکن است باعث اعوجاج شود. سطح صدا را با احتیاط تنظیم کنید.</p></div>
</section>
<section class="glass drive" id="drive"><div class="sub">CHERA DRIVE MODE</div><div class="big" id="driveTitle">آماده پخش</div><div class="muted" id="driveArtist">—</div><div><button id="dprev">⏮</button><button id="dplay">▶ / ⏸</button><button id="dnext">⏭</button></div><button id="exitDrive">خروج از حالت رانندگی</button></section>
<p class="footer">CHERA · موسیقی را با حس تازه تجربه کن</p>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), audio=$('media');
let tracks=[],index=-1,favs=new Set(JSON.parse(localStorage.getItem('chera-favs')||'[]')),shuffle=false,repeat=0,showFav=false,eqOn=true,ctx=null,source=null,filters=[],bassFilter=null,trebleFilter=null,gain=null,analyser=null,raf=0;
const bandsHz=[60,120,230,400,1000,3000,6000,10000,14000,16000],defaults=Array(10).fill(0),bandValues=[...defaults];
const fmt=n=>{if(!Number.isFinite(n))return'0:00';let m=Math.floor(n/60),s=Math.floor(n%60);return m+':'+String(s).padStart(2,'0')};
function setupAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();source=ctx.createMediaElementSource(audio);analyser=ctx.createAnalyser();analyser.fftSize=256;gain=ctx.createGain();bassFilter=ctx.createBiquadFilter();bassFilter.type='lowshelf';bassFilter.frequency.value=100;trebleFilter=ctx.createBiquadFilter();trebleFilter.type='highshelf';trebleFilter.frequency.value=7000;filters=bandsHz.map(f=>{let n=ctx.createBiquadFilter();n.type='peaking';n.frequency.value=f;n.Q.value=1;return n});let chain=[bassFilter,...filters,trebleFilter,gain,analyser,ctx.destination];let node=source;chain.forEach(next=>{node.connect(next);node=next});applySound()}
function applySound(){if(!ctx)return;bassFilter.gain.value=+$('bass').value;trebleFilter.gain.value=+$('treble').value;gain.gain.value=+$('amp').value;filters.forEach((f,i)=>f.gain.value=eqOn?bandValues[i]:0)}
function addFiles(fileList){for(const file of fileList){if(!file.type.startsWith('audio/')&&!file.type.startsWith('video/'))continue;tracks.push({file,url:URL.createObjectURL(file),name:file.name.replace(/\.[^.]+$/,''),video:file.type.startsWith('video/')})}render();if(index<0&&tracks.length)load(0)}
function render(){let list=$('list');list.replaceChildren();let visible=tracks.map((t,i)=>({...t,i})).filter(t=>!showFav||favs.has(t.file.name));if(!visible.length){let p=document.createElement('p');p.className='notice';p.textContent=showFav?'هنوز آهنگ محبوبی ثبت نشده است.':'فهرست خالی است. فایل‌ها را انتخاب کنید.';list.append(p);return}visible.forEach(t=>{let row=document.createElement('div');row.className='song';let name=document.createElement('div');name.className='name';let strong=document.createElement('strong');strong.textContent=t.name;let small=document.createElement('small');small.textContent=t.file.type||'رسانه';name.append(strong,small);let fav=document.createElement('button');fav.className='heart';fav.textContent=favs.has(t.file.name)?'♥':'♡';fav.title='علاقه‌مندی';fav.onclick=()=>{favs.has(t.file.name)?favs.delete(t.file.name):favs.add(t.file.name);localStorage.setItem('chera-favs',JSON.stringify([...favs]));render()};let play=document.createElement('button');play.textContent='▶';play.onclick=()=>load(t.i,true);row.append(name,fav,play);list.append(row)})}
function load(i,autoplay=false){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;let t=tracks[index];audio.src=t.url;audio.classList.toggle('hidden',!t.video);$('title').textContent=t.name;$('artist').textContent=t.video?'ویدیو':'فایل محلی';$('driveTitle').textContent=t.name;$('driveArtist').textContent=t.video?'ویدیو':'فایل محلی';if(autoplay)play();else{$('play').textContent='▶';$('visual').classList.remove('playing')};render()}
async function play(){if(index<0&&tracks.length)load(0);if(!tracks.length)return;try{setupAudio();if(ctx.state==='suspended')await ctx.resume();await audio.play();$('play').textContent='⏸';$('visual').classList.add('playing')}catch(e){$('artist').textContent='پخش انجام نشد؛ دوباره فایل را انتخاب کنید.'}}
function pause(){audio.pause();$('play').textContent='▶';$('visual').classList.remove('playing')}
function next(){if(!tracks.length)return;let n=shuffle?Math.floor(Math.random()*tracks.length):index+1;load(n,true)}
function previous(){if(audio.currentTime>3){audio.currentTime=0;return}load(index-1,true)}
$('pick').onclick=()=>$('files').click();$('folder').onclick=()=>$('folders').click();$('files').onchange=e=>addFiles(e.target.files);$('folders').onchange=e=>addFiles(e.target.files);
$('play').onclick=()=>audio.paused?play():pause();$('next').onclick=next;$('prev').onclick=previous;$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').classList.toggle('active',shuffle)};$('repeat').onclick=()=>{repeat=(repeat+1)%3;audio.loop=repeat===1;$('repeat').classList.toggle('active',repeat>0);$('repeat').textContent=repeat===2?'🔂':'🔁';$('repeat').title=['بدون تکرار','تکرار آهنگ','تکرار فهرست'][repeat]};
audio.onended=()=>{if(repeat===2)next();else if(!audio.loop&&index<tracks.length-1)next();else if(index===tracks.length-1)pause()};
audio.ontimeupdate=()=>{$('current').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);$('seek').value=audio.duration?audio.currentTime/audio.duration*1000:0};
$('seek').oninput=()=>{if(audio.duration)audio.currentTime=$('seek').value/1000*audio.duration};
$('volume').oninput=()=>audio.volume=+$('volume').value;audio.volume=.8;
$('bass').oninput=applySound;$('treble').oninput=applySound;$('amp').oninput=applySound;
$('eqToggle').onclick=()=>{eqOn=!eqOn;$('eqToggle').classList.toggle('active',eqOn);$('eqToggle').textContent=eqOn?'اکولایزر روشن':'اکولایزر خاموش';applySound()};
$('eqReset').onclick=()=>{bandValues.fill(0);document.querySelectorAll('[data-band]').forEach((el,i)=>el.value=0);applySound()};
bandsHz.forEach((hz,i)=>{let wrap=document.createElement('label');wrap.className='band';let input=document.createElement('input');input.type='range';input.min=-12;input.max=12;input.step=1;input.value=0;input.dataset.band=i;input.oninput=()=>{bandValues[i]=+input.value;applySound()};let label=document.createElement('span');label.textContent=hz>=1000?(hz/1000)+'k':hz;wrap.append(input,label);$('bands').append(wrap)});
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===btn));['queue','equalizer','sound'].forEach(id=>$(id).classList.toggle('hidden',id!==btn.dataset.tab))});
$('favView').onclick=()=>{showFav=!showFav;$('favView').classList.toggle('active',showFav);render()};
$('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
$('driveBtn').onclick=()=>{$('drive').classList.add('on');$('drive').scrollIntoView({behavior:'smooth'})};$('exitDrive').onclick=()=>$('drive').classList.remove('on');$('dplay').onclick=()=>$('play').click();$('dnext').onclick=next;$('dprev').onclick=previous;
if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('play',play);navigator.mediaSession.setActionHandler('pause',pause);navigator.mediaSession.setActionHandler('previoustrack',previous);navigator.mediaSession.setActionHandler('nexttrack',next)}
const canvas=$('viz'),g=canvas.getContext('2d');function resize(){let dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);g.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function draw(){raf=requestAnimationFrame(draw);let w=canvas.clientWidth,h=canvas.clientHeight;g.clearRect(0,0,w,h);let data=new Uint8Array(analyser?analyser.frequencyBinCount:64);if(analyser)analyser.getByteFrequencyData(data);else for(let i=0;i<data.length;i++)data[i]=8+Math.sin(Date.now()/500+i)*5;let cx=w/2,cy=h/2,rad=Math.min(w,h)*.34;for(let i=0;i<64;i++){let v=data[i]||0,a=i/64*Math.PI*2-Math.PI/2,len=8+v*.34;g.beginPath();g.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);g.lineTo(cx+Math.cos(a)*(rad+len),cy+Math.sin(a)*(rad+len));g.strokeStyle=i%2?'#00e5ff':'#9878ff';g.globalAlpha=.25+v/350;g.lineWidth=2;g.stroke()}g.globalAlpha=1}draw();
window.addEventListener('beforeunload',()=>{cancelAnimationFrame(raf);tracks.forEach(t=>URL.revokeObjectURL(t.url))});
})();
</script>
</body></html>
